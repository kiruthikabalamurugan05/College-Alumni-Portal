<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Alumni Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="page">

        <div class="form-card">

            <h1>Welcome Back</h1>

            <p class="form-subtitle">
                Alumni Portal
            </p>


            <a href="{{ url_for('login') }}"
               class="switch-link">

                Login to your account

            </a>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}


            <form method="POST">


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">

                    Sign In

                </button>


            </form>


            <p class="bottom-text">

                Use your registered email and password
                to login.

            </p>


            <a href="{{ url_for('register_college') }}"
               class="register-link">

                Register Your College

            </a>

        </div>

    </div>

</body>

</html>
