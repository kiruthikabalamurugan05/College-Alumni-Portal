<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Student - Alumni Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="page">

    <div class="student-form-card">


        <!-- HEADER -->

        <div class="student-form-header">

            <h1>Student Account Registration</h1>

            <p>
                Create your student account and connect with your college alumni community.
            </p>

        </div>


        <form
            method="POST"
            enctype="multipart/form-data"
        >


            <!-- =====================================
                 SELECT COLLEGE
            ====================================== -->

            <div class="form-section">

                <h2>Select College</h2>


                <div class="form-group full-width">

                    <label>
                        Registered College
                        <span>*</span>
                    </label>

                    <select
                        name="college_id"
                        required
                    >

                        <option value="">
                            -- Select Your Approved College --
                        </option>

                        {% for college in colleges %}

                        <option value="{{ college._id }}">
                            {{ college.college_name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>



            <!-- =====================================
                 PERSONAL INFORMATION
            ====================================== -->

            <div class="form-section">

                <h2>Personal Information</h2>


                <div class="form-grid">


                    <!-- Full Name -->

                    <div class="form-group">

                        <label>
                            Full Name
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label>
                            Email Address
                            <span>*</span>
                        </label>

                        <input
                            type="email"
                            name="email"
                            placeholder="student@example.com"
                            required
                        >

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label>
                            Password
                            <span>*</span>
                        </label>

                        <input
                            type="password"
                            name="password"
                            placeholder="Create password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label>
                            Confirm Password
                            <span>*</span>
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Confirm password"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label>
                            Phone Number
                            <span>*</span>
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            placeholder="+91 9876543210"
                            required
                        >

                    </div>


                    <!-- Gender -->

                    <div class="form-group">

                        <label>
                            Gender
                        </label>

                        <select name="gender">

                            <option value="">
                                Select Gender
                            </option>

                            <option value="Male">
                                Male
                            </option>

                            <option value="Female">
                                Female
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Date of Birth -->

                    <div class="form-group">

                        <label>
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            name="date_of_birth"
                        >

                    </div>


                    <!-- Profile Picture -->

                    <div class="form-group">

                        <label>
                            Profile Picture
                        </label>

                        <input
                            type="file"
                            name="profile_picture"
                            accept="image/*"
                        >

                    </div>


                </div>

            </div>



            <!-- =====================================
                 ACADEMIC DETAILS
            ====================================== -->

            <div class="form-section">

                <h2>Academic Details</h2>


                <div class="form-grid">


                    <!-- Register Number -->

                    <div class="form-group">

                        <label>
                            Register / Roll Number
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            name="register_number"
                            placeholder="Enter register number"
                            required
                        >

                    </div>


                    <!-- Degree -->

                    <div class="form-group">

                        <label>
                            Degree Program
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            name="degree"
                            placeholder="e.g. B.Tech / B.E / M.C.A"
                            required
                        >

                    </div>


                    <!-- Department -->

                    <div class="form-group">

                        <label>
                            Department
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            name="department"
                            placeholder="e.g. Information Technology"
                            required
                        >

                    </div>


                    <!-- Batch -->

                    <div class="form-group">

                        <label>
                            Batch
                            <span>*</span>
                        </label>

                        <input
                            type="text"
                            name="batch"
                            placeholder="e.g. 2022-2026"
                            required
                        >

                    </div>


                    <!-- Graduation Year -->

                    <div class="form-group">

                        <label>
                            Graduation Year
                            <span>*</span>
                        </label>

                        <input
                            type="number"
                            name="graduation_year"
                            placeholder="e.g. 2026"
                            min="2000"
                            max="2100"
                            required
                        >

                    </div>


                </div>

            </div>



            <!-- =====================================
                 APPROVAL INFORMATION
            ====================================== -->

            <div class="student-registration-info">

                <strong>Account Approval</strong>

                <p>
                    Your account will require approval by your
                    College Administrator before you can log in.
                </p>

            </div>



            <!-- =====================================
                 SUBMIT
            ====================================== -->

            <button
                type="submit"
                class="student-submit-button"
            >
                Submit Student Registration
            </button>


            <!-- BACK -->

            <a
                href="{{ url_for('home') }}"
                class="back-home"
            >
                Back to Home
            </a>


        </form>

    </div>

</div>

</body>

</html>
